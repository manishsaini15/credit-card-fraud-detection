name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify FastAPI Import
        run: |
          python -c "from src.deployment.app import app"

      - name: Verify Prediction Pipeline
        run: |
          python -c "from src.deployment.prediction import PredictionPipeline"

      - name: Run Unit Tests
        run: |
          pytest tests/ -v